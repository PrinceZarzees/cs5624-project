[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphharness"
version = "0.2.0"
description = "Harness optimization for graph reasoning (CS 5624 project)"
requires-python = ">=3.10"
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3"]
grapharena = ["gdown>=5", "rdkit>=2024.3"]
all = ["pytest>=7", "matplotlib>=3", "gdown>=5", "rdkit>=2024.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
